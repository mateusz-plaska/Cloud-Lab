server.port=8082
spring.application.name=packing-service

spring.datasource.url=jdbc:postgresql://${RDS_HOST}:${RDS_PORT}/${PACKING_DB_NAME}
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

spring.rabbitmq.addresses=${RABBITMQ_URL}
rabbitmq.system.exchange.name=${RABBITMQ_EXCHANGE}
rabbitmq.packing.queue.name=packing.tasks.queue