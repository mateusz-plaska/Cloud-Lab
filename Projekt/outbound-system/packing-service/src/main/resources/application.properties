server.port=8082
spring.application.name=packing-service

spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# connection pool constraints for db.t4g.micro
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000

spring.datasource.url=jdbc:postgresql://${RDS_HOST}:${RDS_PORT}/${PACKING_DB_NAME}
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

spring.rabbitmq.addresses=${RABBITMQ_URL}
rabbitmq.system.exchange.name=${RABBITMQ_EXCHANGE}
rabbitmq.packing.queue.name=packing.tasks.queue