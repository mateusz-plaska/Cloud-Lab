server.port=8084
spring.application.name=reservation-service

spring.datasource.url=jdbc:postgresql://${RDS_HOST}:${RDS_PORT}/${RESERVATION_DB_NAME}
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

spring.rabbitmq.addresses=${RABBITMQ_URL}
rabbitmq.system.exchange.name=${RABBITMQ_EXCHANGE}
rabbitmq.reservation.queue.name=inventory.reservation.queue