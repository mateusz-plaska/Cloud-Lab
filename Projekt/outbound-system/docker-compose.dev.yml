services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - outbound-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - outbound-net

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    networks:
      - outbound-net

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    user: root
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    networks:
      - outbound-net

  dynamodb-init:
    image: amazon/aws-cli
    depends_on:
      - dynamodb-local
    environment:
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: ""
    command:
      - /bin/sh
      - -c
      - |
        until aws --endpoint-url http://dynamodb-local:8000 dynamodb list-tables > /dev/null 2>&1; do
          echo 'Waiting for DynamoDB...'; sleep 2;
        done &&
        aws --endpoint-url http://dynamodb-local:8000 dynamodb create-table --table-name picking_tasks --attribute-definitions AttributeName=PK,AttributeType=S --key-schema AttributeName=PK,KeyType=HASH --billing-mode PAY_PER_REQUEST 2>/dev/null || true &&
        aws --endpoint-url http://dynamodb-local:8000 dynamodb create-table --table-name shipments --attribute-definitions AttributeName=PK,AttributeType=S --key-schema AttributeName=PK,KeyType=HASH --billing-mode PAY_PER_REQUEST 2>/dev/null || true
    networks:
      - outbound-net

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin
    container_name: dynamodb-admin
    ports:
      - "8001:8001"
    environment:
      - DYNAMO_ENDPOINT=http://dynamodb-local:8000
    depends_on:
      - dynamodb-local
    networks:
      - outbound-net

  order-gateway-service:
    build:
      context: .
      dockerfile: order-gateway-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - RDS_HOST=postgres
      - RDS_PORT=5432
      - ORDER_DB_NAME=orderdb
      - RDS_USERNAME=postgres
      - RDS_PASSWORD=postgres
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - RABBITMQ_EXCHANGE=outbound.events
      - S3_ENDPOINT=http://minio:9000
      - AWS_BUCKET_NAME=orders-local
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    restart: on-failure
    networks:
      - outbound-net

  packing-service:
    build:
      context: .
      dockerfile: packing-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - RDS_HOST=postgres
      - RDS_PORT=5432
      - PACKING_DB_NAME=packingdb
      - RDS_USERNAME=postgres
      - RDS_PASSWORD=postgres
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - RABBITMQ_EXCHANGE=outbound.events
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    networks:
      - outbound-net

  picking-service:
    build:
      context: .
      dockerfile: picking-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - RABBITMQ_EXCHANGE=outbound.events
    depends_on:
      rabbitmq:
        condition: service_healthy
      dynamodb-init:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - outbound-net

  reservation-service:
    build:
      context: .
      dockerfile: reservation-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      - RDS_HOST=postgres
      - RDS_PORT=5432
      - RESERVATION_DB_NAME=reservationdb
      - RDS_USERNAME=postgres
      - RDS_PASSWORD=postgres
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - RABBITMQ_EXCHANGE=outbound.events
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    networks:
      - outbound-net

  shipping-service:
    build:
      context: .
      dockerfile: shipping-service/Dockerfile
    ports:
      - "8085:8085"
    environment:
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - RABBITMQ_EXCHANGE=outbound.events
      - RDS_HOST=postgres
      - RDS_PORT=5432
      - SHIPPING_DB_NAME=shippingdb
      - RDS_USERNAME=postgres
      - RDS_PASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      dynamodb-init:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - outbound-net

  bff-service:
    build:
      context: .
      dockerfile: bff-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - RDS_HOST=postgres
      - RDS_PORT=5432
      - BFF_DB_NAME=bffdb
      - RDS_USERNAME=postgres
      - RDS_PASSWORD=postgres
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - RABBITMQ_EXCHANGE=outbound.events
      - JWT_SECRET=c91a813ba3d19c6162dd2c9fac50f7bbfd96adf58d9be7a5afb2e0685c72b47f
      - CORS_ALLOWED_ORIGINS=http://localhost:4200
      - ORDER_GATEWAY_URL=http://order-gateway-service:8081
      - PACKING_SERVICE_URL=http://packing-service:8082
      - PICKING_SERVICE_URL=http://picking-service:8083
      - RESERVATION_SERVICE_URL=http://reservation-service:8084
      - SHIPPING_SERVICE_URL=http://shipping-service:8085
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    networks:
      - outbound-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - bff-service
    networks:
      - outbound-net

volumes:
  postgres-data:
  dynamodb-data:

networks:
  outbound-net:
    driver: bridge