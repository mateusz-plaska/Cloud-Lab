services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - outbound-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - outbound-net

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    networks:
      - outbound-net

  order-gateway-service:
    build:
      context: .
      dockerfile: order-gateway-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - RDS_HOST=postgres
      - RDS_PORT=5432
      - ORDER_DB_NAME=orderdb
      - RDS_USERNAME=postgres
      - RDS_PASSWORD=postgres
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - RABBITMQ_EXCHANGE=outbound.events
      - S3_ENDPOINT=http://minio:9000
      - AWS_BUCKET_NAME=orders-local
    depends_on:
      - postgres
      - rabbitmq
      - minio
    networks:
      - outbound-net

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    user: root
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    networks:
      - outbound-net

  dynamodb-init:
    image: amazon/aws-cli
    depends_on:
      - dynamodb-local
    environment:
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: ""
    command:
      - /bin/sh
      - -c
      - |
        until aws --endpoint-url http://dynamodb-local:8000 dynamodb list-tables > /dev/null 2>&1; do
          echo 'Waiting for DynamoDB...'; sleep 2;
        done &&
        aws --endpoint-url http://dynamodb-local:8000 dynamodb create-table --table-name picking_tasks --attribute-definitions AttributeName=PK,AttributeType=S --key-schema AttributeName=PK,KeyType=HASH --billing-mode PAY_PER_REQUEST 2>/dev/null || true &&
        aws --endpoint-url http://dynamodb-local:8000 dynamodb create-table --table-name shipments --attribute-definitions AttributeName=PK,AttributeType=S --key-schema AttributeName=PK,KeyType=HASH --billing-mode PAY_PER_REQUEST 2>/dev/null || true
    networks:
      - outbound-net

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin
    container_name: dynamodb-admin
    ports:
      - "8001:8001"
    environment:
      - DYNAMO_ENDPOINT=http://dynamodb-local:8000
    depends_on:
      - dynamodb-local
    networks:
      - outbound-net

  picking-service:
    build:
      context: .
      dockerfile: picking-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - RABBITMQ_EXCHANGE=outbound.events
    depends_on:
      - rabbitmq
      - dynamodb-init
    networks:
      - outbound-net

  shipping-service:
    build:
      context: .
      dockerfile: shipping-service/Dockerfile
    ports:
      - "8085:8085"
    environment:
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - RABBITMQ_EXCHANGE=outbound.events
      - RDS_HOST=postgres
      - RDS_PORT=5432
      - SHIPPING_DB_NAME=shippingdb
      - RDS_USERNAME=postgres
      - RDS_PASSWORD=postgres
    depends_on:
      - postgres
      - rabbitmq
      - dynamodb-init
    networks:
      - outbound-net

volumes:
  postgres-data:
  dynamodb-data:

networks:
  outbound-net:
    driver: bridge