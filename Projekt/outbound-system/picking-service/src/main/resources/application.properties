server.port=8083
spring.application.name=picking-service

aws.region=${AWS_REGION:us-east-1}
aws.access-key=${AWS_ACCESS_KEY_ID:local}
aws.secret-key=${AWS_SECRET_ACCESS_KEY:local}
aws.session-token=${AWS_SESSION_TOKEN:}
aws.dynamodb.endpoint=${DYNAMODB_ENDPOINT:}

aws.dynamodb.picking-table=picking_tasks

spring.rabbitmq.addresses=${RABBITMQ_URL}
rabbitmq.system.exchange.name=${RABBITMQ_EXCHANGE}
rabbitmq.picking.tasks.queue.name=picking.tasks.queue