server.port=8085
spring.application.name=shipping-service

aws.region=${AWS_REGION:us-east-1}
aws.access-key=${AWS_ACCESS_KEY_ID:local}
aws.secret-key=${AWS_SECRET_ACCESS_KEY:local}
aws.session-token=${AWS_SESSION_TOKEN:}
aws.dynamodb.endpoint=${DYNAMODB_ENDPOINT:}

aws.dynamodb.shipping-table=shipments

spring.datasource.url=jdbc:postgresql://${RDS_HOST:localhost}:${RDS_PORT:5432}/${SHIPPING_DB_NAME}
spring.datasource.username=${RDS_USERNAME:postgres}
spring.datasource.password=${RDS_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update

spring.rabbitmq.addresses=${RABBITMQ_URL}
rabbitmq.system.exchange.name=${RABBITMQ_EXCHANGE}
rabbitmq.shipping.queue.name=shipping.queue

# Simulated dispatch delay after packing (seconds)
shipping.dispatch-delay.min-seconds=30
shipping.dispatch-delay.max-seconds=300