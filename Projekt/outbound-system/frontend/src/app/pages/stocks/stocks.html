<div class="p-8">
  <h2 class="mb-6 text-2xl font-bold text-slate-900">Stan magazynowy</h2>

  <div class="max-w-md rounded-xl bg-white p-6 shadow-sm">
    <h3 class="mb-4 font-semibold text-slate-700">Dodaj stan magazynowy</h3>

    <div class="mb-4">
      <label class="mb-1 block text-sm font-medium text-slate-700">ID produktu</label>
      <input
        type="text"
        [(ngModel)]="productId"
        placeholder="uuid produktu"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
      />
    </div>

    <div class="mb-6">
      <label class="mb-1 block text-sm font-medium text-slate-700">Ilość</label>
      <input
        type="number"
        [(ngModel)]="quantity"
        min="1"
        max="1000"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
      />
    </div>

    @if (successMsg()) {
      <p class="mb-4 rounded-lg bg-green-50 px-3 py-2 text-sm text-green-700">{{ successMsg() }}</p>
    }
    @if (errorMsg()) {
      <p class="mb-4 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-600">{{ errorMsg() }}</p>
    }

    <button
      (click)="submit()"
      [disabled]="!productId || quantity < 1 || loading()"
      class="w-full rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700 disabled:opacity-50"
    >
      {{ loading() ? 'Zapisywanie...' : 'Dodaj stan' }}
    </button>
  </div>
</div>
