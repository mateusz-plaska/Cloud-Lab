<div class="p-8">
  <div class="mb-6 flex items-center gap-4">
    <h2 class="text-2xl font-bold text-slate-900">Nowe zamówienie</h2>
  </div>

  <div class="max-w-xl rounded-xl bg-white p-6 shadow-sm">
    @if (options().length === 0) {
      <p class="mb-4 rounded-lg bg-amber-50 px-3 py-2 text-sm text-amber-700">
        Brak produktów w katalogu. Skontaktuj się z administratorem.
      </p>
    }

    <div class="mb-4 space-y-3">
      <div class="grid grid-cols-[1fr_96px_32px] gap-2 text-xs font-semibold text-slate-500">
        <span>Produkt</span>
        <span>Ilość</span>
        <span></span>
      </div>

      @for (item of items(); track $index) {
        <div class="grid grid-cols-[1fr_96px_32px] items-center gap-2">
          <select
            [value]="item.productId"
            (change)="updateItem($index, 'productId', $any($event.target).value)"
            class="rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
          >
            <option value="">-- Wybierz --</option>
            @for (opt of options(); track opt.productId) {
              <option [value]="opt.productId">
                {{ opt.name }}@if (opt.quantity > 0) { ({{ opt.quantity }} szt.)}
              </option>
            }
          </select>
          <input
            type="number"
            [value]="item.quantity"
            (input)="updateItem($index, 'quantity', +$any($event.target).value)"
            min="1"
            class="rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
          />
          @if (items().length > 1) {
            <button
              type="button"
              (click)="removeItem($index)"
              class="flex h-8 w-8 items-center justify-center rounded-lg text-slate-400 hover:bg-red-50 hover:text-red-500"
            >✕</button>
          }
        </div>
      }
    </div>

    <button
      type="button"
      (click)="addItem()"
      [disabled]="options().length === 0"
      class="mb-6 text-sm text-indigo-600 hover:text-indigo-800 disabled:cursor-not-allowed disabled:opacity-40"
    >
      + Dodaj produkt
    </button>

    @if (error()) {
      <p class="mb-4 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-600">{{ error() }}</p>
    }

    <button
      (click)="submit()"
      [disabled]="loading() || options().length === 0"
      class="w-full rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700 disabled:opacity-50"
    >
      {{ loading() ? 'Składanie...' : 'Złóż zamówienie' }}
    </button>
  </div>
</div>
