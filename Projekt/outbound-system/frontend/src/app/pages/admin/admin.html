<div class="p-8">
  <h2 class="mb-6 text-2xl font-bold text-slate-900">Zarządzanie użytkownikami</h2>

  @if (loading()) {
    <p class="text-slate-500">Ładowanie...</p>
  } @else if (error()) {
    <p class="rounded-lg bg-red-50 px-4 py-3 text-sm text-red-600">{{ error() }}</p>
  } @else {
    <div class="overflow-hidden rounded-xl bg-white shadow-sm">
      <table class="w-full text-sm">
        <thead class="border-b border-slate-200 bg-slate-50">
          <tr>
            <th class="px-6 py-3 text-left font-semibold text-slate-600">Użytkownik</th>
            <th class="px-6 py-3 text-left font-semibold text-slate-600">Email</th>
            <th class="px-6 py-3 text-left font-semibold text-slate-600">Rola</th>
            <th class="px-6 py-3 text-left font-semibold text-slate-600">Utworzono</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          @for (user of users(); track user.id) {
            <tr class="hover:bg-slate-50">
              <td class="px-6 py-4 font-medium text-slate-900">{{ user.username }}</td>
              <td class="px-6 py-4 text-slate-600">{{ user.email }}</td>
              <td class="px-6 py-4">
                <span
                  class="rounded-full px-2 py-1 text-xs font-semibold"
                  [class.bg-red-100]="user.role === 'ADMIN'"
                  [class.text-red-800]="user.role === 'ADMIN'"
                  [class.bg-indigo-100]="user.role === 'OPERATOR'"
                  [class.text-indigo-800]="user.role === 'OPERATOR'"
                  [class.bg-slate-100]="user.role === 'USER'"
                  [class.text-slate-800]="user.role === 'USER'"
                >
                  {{ user.role }}
                </span>
              </td>
              <td class="px-6 py-4 text-slate-500">{{ formatDate(user.createdAt) }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
