<div class="flex h-screen bg-slate-50">
  <aside
    class="relative flex flex-shrink-0 flex-col overflow-hidden bg-slate-900 transition-all duration-300"
    [class.w-64]="!collapsed()"
    [class.w-16]="collapsed()"
  >
    <div
      class="flex items-center border-b border-slate-700 p-4"
      [class.justify-between]="!collapsed()"
      [class.justify-center]="collapsed()"
    >
      @if (!collapsed()) {
        <div class="min-w-0">
          <h1 class="truncate text-lg font-bold text-white">Warehouse</h1>
          <p class="truncate text-sm text-slate-400">{{ auth.user()?.username }}</p>
          <span class="mt-1 inline-block rounded bg-indigo-600 px-2 py-0.5 text-xs font-semibold text-white">
            {{ auth.user()?.role }}
          </span>
        </div>
      }
      <button
        (click)="toggle()"
        [title]="collapsed() ? 'Rozwiń menu' : 'Zwiń menu'"
        class="flex-shrink-0 rounded-md p-1.5 text-slate-400 transition-colors hover:bg-slate-700 hover:text-white"
      >
        <svg class="h-5 w-5 transition-transform duration-300" [class.rotate-180]="collapsed()" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
    </div>

    <nav class="flex-1 space-y-1 overflow-y-auto p-3">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-slate-700 text-white"
          [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
          [title]="collapsed() ? item.label : ''"
          class="flex items-center rounded-md px-2 py-2 text-sm text-slate-300 transition-colors hover:bg-slate-700 hover:text-white"
          [class.justify-center]="collapsed()"
        >
          <svg class="h-5 w-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" [attr.d]="item.icon"/>
          </svg>
          @if (!collapsed()) {
            <span class="ml-3 truncate">{{ item.label }}</span>
          }
        </a>
      }
    </nav>

    <div class="border-t border-slate-700 p-3">
      <button
        (click)="logout()"
        [title]="collapsed() ? 'Wyloguj' : ''"
        class="flex w-full items-center rounded-md px-2 py-2 text-sm text-slate-400 transition-colors hover:bg-slate-700 hover:text-white"
        [class.justify-center]="collapsed()"
      >
        <svg class="h-5 w-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        @if (!collapsed()) {
          <span class="ml-3">Wyloguj</span>
        }
      </button>
    </div>
  </aside>

  <main class="flex-1 overflow-auto">
    <router-outlet />
  </main>
</div>
