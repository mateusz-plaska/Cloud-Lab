<div class="flex h-screen bg-slate-50">
  <aside class="flex w-64 flex-shrink-0 flex-col bg-slate-900">
    <div class="border-b border-slate-700 p-6">
      <h1 class="text-lg font-bold text-white">Warehouse</h1>
      <p class="mt-1 text-sm text-slate-400">{{ auth.user()?.username }}</p>
      <span class="mt-2 inline-block rounded px-2 py-0.5 text-xs font-semibold bg-indigo-600 text-white">
        {{ auth.user()?.role }}
      </span>
    </div>

    <nav class="flex-1 space-y-1 p-4">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-slate-700 text-white"
          [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
          class="flex items-center rounded-md px-3 py-2 text-sm text-slate-300 transition-colors hover:bg-slate-700 hover:text-white"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="border-t border-slate-700 p-4">
      <button
        (click)="logout()"
        class="w-full rounded-md px-3 py-2 text-left text-sm text-slate-400 transition-colors hover:bg-slate-700 hover:text-white"
      >
        Wyloguj
      </button>
    </div>
  </aside>

  <main class="flex-1 overflow-auto">
    <router-outlet />
  </main>
</div>
