server.port=8081
spring.application.name=order-gateway-service

spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# connection pool constraints for db.t4g.micro
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000

spring.datasource.url=jdbc:postgresql://${RDS_HOST}:${RDS_PORT}/${ORDER_DB_NAME}
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

spring.rabbitmq.addresses=${RABBITMQ_URL}
rabbitmq.system.exchange.name=${RABBITMQ_EXCHANGE}
rabbitmq.order.queue.name=order.queue

aws.s3.region=${AWS_REGION}
aws.s3.bucket-name=${AWS_BUCKET_NAME}
aws.s3.access-key=${AWS_ACCESS_KEY_ID}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY}
aws.s3.session-token=${AWS_SESSION_TOKEN}