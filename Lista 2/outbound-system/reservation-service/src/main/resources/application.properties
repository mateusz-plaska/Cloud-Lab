server.port=8084
spring.application.name=reservation-service

spring.datasource.url=jdbc:postgresql://localhost:5433/${POSTGRES_DB}?currentSchema=reservation_schema
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=reservation_schema

spring.rabbitmq.addresses=${RABBITMQ_URL}